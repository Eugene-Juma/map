<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Map Explorer PWA</title>
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.92);
      --panel-border: rgba(148, 163, 184, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    #map { width: 100%; height: 100%; }

    /* Main Panel */
   .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 320px;
      max-height: calc(100dvh - 24px);
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      z-index: 1000;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.3s;
    }
   .panel.collapsed {
      transform: translateX(-340px);
      opacity: 0;
      pointer-events: none;
    }

   .panel h2 {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
   .section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
   .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 600;
    }
    select, button, input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: rgba(30, 41, 59, 0.8);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
    }
    button {
      background: var(--primary);
      border: none;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button:hover { filter: brightness(1.15); }
    button.ghost { background: rgba(51, 65, 85, 0.8); }
    button.danger { background: var(--danger); }
    button.icon { font-size: 1.1rem; width: 20px; text-align: center; }
    button.kbd {
      margin-left: auto;
      font-size: 0.7rem;
      opacity: 0.6;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Toggle FAB */
   .fab {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1100;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

   .note {
      font-size: 0.8rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 10px;
      border-radius: 10px;
      line-height: 1.5;
    }
   .hidden { display: none!important; }

    /* Mobile */
    @media (max-width: 640px) {
     .panel {
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        width: auto;
        max-height: 70dvh;
        border-radius: var(--radius) var(--radius) 0 0;
        transform: translateY(100%);
      }
     .panel:not(.collapsed) { transform: translateY(0); }
     .fab { top: auto; bottom: 16px; }
    }

    /* Hide Leaflet draw toolbar - we use our own buttons */
   .leaflet-draw-toolbar { display: none!important; }
   .leaflet-control-layers {
      background: var(--panel)!important;
      border: 1px solid var(--panel-border)!important;
      color: var(--text)!important;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <button class="fab" id="togglePanel">☰</button>

  <div class="panel collapsed" id="panel">
    <h2>🗺️ Map Explorer</h2>

    <div class="section">
      <div class="section-label">Base Map - Only working layers</div>
      <select id="basemap">
        <option value="osm">OpenStreetMap</option>
        <option value="cartodark">Carto Dark</option>
        <option value="cartolight">Carto Light</option>
        <option value="topo">OpenTopoMap</option>
        <option value="esri">Esri Satellite</option>
        <option value="esristreet">Esri Streets</option>
        <option value="stadia">Stadia Smooth</option>
      </select>
    </div>

    <div class="section">
      <div class="section-label">Location & View</div>
      <button id="locateBtn">
        <span class="icon">📍</span>
        <span>Find My Location</span>
        <span class="kbd">L</span>
      </button>
      <button id="fullscreenBtn" class="ghost">
        <span class="icon">⛶</span>
        <span>Toggle Fullscreen</span>
        <span class="kbd">F</span>
      </button>
    </div>

    <div class="section">
      <div class="section-label">Draw on Map</div>
      <button id="drawMarker" class="ghost">
        <span class="icon">📌</span>
        <span>Add Marker</span>
      </button>
      <button id="drawLine" class="ghost">
        <span class="icon">📏</span>
        <span>Draw Line</span>
      </button>
      <button id="drawPolygon" class="ghost">
        <span class="icon">⬟</span>
        <span>Draw Area</span>
      </button>
      <button id="clearBtn" class="danger">
        <span class="icon">🗑️</span>
        <span>Clear All Drawings</span>
        <span class="kbd">Del</span>
      </button>
    </div>

    <div class="section">
      <div class="section-label">Save & Load</div>
      <button id="exportBtn" class="ghost">
        <span class="icon">💾</span>
        <span>Export as GeoJSON</span>
      </button>
      <input type="file" id="importFile" accept=".json,.geojson">
    </div>

    <div id="httpWarning" class="note hidden">
      ⚠️ You're on HTTP. "Find My Location" needs HTTPS. Enable SSL in your hosting panel for full features.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <script>
    // --- Only working base maps - no API keys needed ---
    const baseMaps = {
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OSM' }),
      cartodark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:20, attribution:'© Carto' }),
      cartolight: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { subdomains:'abcd', maxZoom:20, attribution:'© Carto' }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom:17, attribution:'© OpenTopoMap' }),
      esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'© Esri' }),
      esristreet: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'© Esri' }),
      stadia: L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth/{z}/{x}/{y}{r}.png', { maxZoom:20, attribution:'© Stadia' })
    };

    const map = L.map('map', {
      center: [0, 37],
      zoom: 6,
      layers: [baseMaps.osm],
      zoomControl: false
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.Control.geocoder({ position: 'bottomright', placeholder: 'Search location...' }).addTo(map);

    // --- UI Logic ---
    const panel = document.getElementById('panel');
    const toggleBtn = document.getElementById('togglePanel');
    toggleBtn.onclick = () => {
      panel.classList.toggle('collapsed');
      toggleBtn.textContent = panel.classList.contains('collapsed')? '☰' : '✕';
      setTimeout(() => map.invalidateSize(), 300);
    };

    // Show HTTP warning
    if (location.protocol === 'http:') {
      document.getElementById('httpWarning').classList.remove('hidden');
    }

    // Base map switcher
    document.getElementById('basemap').onchange = e => {
      Object.values(baseMaps).forEach(l => map.removeLayer(l));
      baseMaps[e.target.value].addTo(map);
      localStorage.setItem('basemap', e.target.value);
    };
    const savedBasemap = localStorage.getItem('basemap') || 'osm';
    document.getElementById('basemap').value = savedBasemap;
    baseMaps[savedBasemap].addTo(map);

    // Drawing
    const drawnItems = new L.FeatureGroup().addTo(map);
    const drawControl = new L.Control.Draw({
      edit: { featureGroup: drawnItems },
      draw: { marker: true, polyline: true, polygon: true, rectangle: true, circle: true, circlemarker: false }
    });
    // We hide the default toolbar and trigger via buttons instead
    map.addControl(drawControl);

    document.getElementById('drawMarker').onclick = () => new L.Draw.Marker(map).enable();
    document.getElementById('drawLine').onclick = () => new L.Draw.Polyline(map).enable();
    document.getElementById('drawPolygon').onclick = () => new L.Draw.Polygon(map).enable();

    map.on(L.Draw.Event.CREATED, e => {
      drawnItems.addLayer(e.layer);
      saveData();
    });

    // Save/Load
    function saveData() {
      localStorage.setItem('drawings', JSON.stringify(drawnItems.toGeoJSON()));
    }
    function loadData() {
      const raw = localStorage.getItem('drawings');
      if (!raw) return;
      try {
        L.geoJSON(JSON.parse(raw)).eachLayer(l => drawnItems.addLayer(l));
      } catch(e) {}
    }
    loadData();

    document.getElementById('clearBtn').onclick = () => {
      if (confirm('Remove all markers and drawings?')) {
        drawnItems.clearLayers();
        localStorage.removeItem('drawings');
      }
    };

    document.getElementById('exportBtn').onclick = () => {
      const data = JSON.stringify(drawnItems.toGeoJSON());
      const blob = new Blob([data], {type:"application/geo+json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "map-export.geojson";
      a.click();
    };

    document.getElementById('importFile').onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          drawnItems.clearLayers();
          L.geoJSON(JSON.parse(reader.result)).eachLayer(l => drawnItems.addLayer(l));
          saveData();
        } catch (err) {
          alert("Invalid GeoJSON file");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    // Tools
    document.getElementById('locateBtn').onclick = () => {
      if (location.protocol === 'http:') {
        alert('Location needs HTTPS. Enable SSL in your hosting panel first.');
        return;
      }
      map.locate({ setView: true, maxZoom: 16 });
    };
    map.on('locationfound', e => {
      L.circleMarker(e.latlng, { radius: 8, color: '#3b82f6', fillOpacity: 0.7 }).addTo(map).bindPopup("You are here").openPopup();
    });

    document.getElementById('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 'l' || e.key === 'L') document.getElementById('locateBtn').click();
      if (e.key === 'f' || e.key === 'F') document.getElementById('fullscreenBtn').click();
      if (e.key === 'Delete') document.getElementById('clearBtn').click();
    });

    // Open panel by default on desktop
    if (window.innerWidth > 640) {
      panel.classList.remove('collapsed');
      toggleBtn.textContent = '✕';
    }
  </script>
</body>
</html>
